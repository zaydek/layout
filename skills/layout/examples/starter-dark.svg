<svg xmlns="http://www.w3.org/2000/svg" width="672" height="239" viewBox="0 0 672 239" role="img" aria-label="starter.layout">
<title>starter.layout</title>
<rect width="100%" height="100%" rx="6" fill="#1E1E1E"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#D4D4D4" style="white-space: pre">
<text x="16" y="29" xml:space="preserve"><tspan fill="#6A9955"># A first contract for an existing repo: every top-level entry named, every</tspan></text>
<text x="16" y="48" xml:space="preserve"><tspan fill="#6A9955"># folder left open with {}. Tighten one folder per change.</tspan></text>
<text x="16" y="86" xml:space="preserve">README.md</text>
<text x="16" y="105" xml:space="preserve">repo.layout                            <tspan fill="#6A9955"># This contract</tspan></text>
<text x="16" y="124" xml:space="preserve"><tspan fill="#569cd6">?</tspan>LICENSE</text>
<text x="16" y="143" xml:space="preserve"><tspan fill="#569cd6">?</tspan>.gitignore</text>
<text x="16" y="162" xml:space="preserve">src/                                   <tspan fill="#6A9955"># The code; describe it next</tspan></text>
<text x="16" y="181" xml:space="preserve">  <tspan fill="#C586C0">{}</tspan></text>
<text x="16" y="200" xml:space="preserve">docs/                                  <tspan fill="#6A9955"># Docs, named by whoever writes them</tspan></text>
<text x="16" y="219" xml:space="preserve">  <tspan fill="#C586C0">{}</tspan></text>
</g>
</svg>
