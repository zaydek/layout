<svg xmlns="http://www.w3.org/2000/svg" width="672" height="429" viewBox="0 0 672 429" role="img" aria-label="go.layout">
<title>go.layout</title>
<rect width="100%" height="100%" rx="6" fill="#1E1E1E"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#D4D4D4" style="white-space: pre">
<text x="16" y="29" xml:space="preserve"><tspan fill="#6A9955"># A Go module: binaries in cmd/, private packages in internal/.</tspan></text>
<text x="16" y="67" xml:space="preserve">$<tspan fill="#4EC9B0">cmd</tspan>:<tspan fill="#d16969">  [a-z][a-z0-9-]*</tspan>                 <tspan fill="#6A9955"># e.g. api, migrate-db</tspan></text>
<text x="16" y="86" xml:space="preserve">$<tspan fill="#4EC9B0">pkg</tspan>:<tspan fill="#d16969">  [a-z][a-z0-9]*</tspan>                  <tspan fill="#6A9955"># e.g. auth, billing</tspan></text>
<text x="16" y="105" xml:space="preserve">$<tspan fill="#4EC9B0">file</tspan>:<tspan fill="#d16969"> [a-z][a-z0-9_]*</tspan>                 <tspan fill="#6A9955"># e.g. handler, user_store</tspan></text>
<text x="16" y="124" xml:space="preserve">$<tspan fill="#4EC9B0">code</tspan>: <tspan fill="#d4d4d4">&lt;=</tspan><tspan fill="#b5cea8">1,000</tspan>                         <tspan fill="#6A9955"># At most 1,000 lines</tspan></text>
<text x="16" y="162" xml:space="preserve">README.md</text>
<text x="16" y="181" xml:space="preserve">go.mod</text>
<text x="16" y="200" xml:space="preserve"><tspan fill="#569cd6">?</tspan>go.sum</text>
<text x="16" y="219" xml:space="preserve">repo.layout                            <tspan fill="#6A9955"># This contract</tspan></text>
<text x="16" y="238" xml:space="preserve">cmd/                                   <tspan fill="#6A9955"># One folder per binary</tspan></text>
<text x="16" y="257" xml:space="preserve">  $<tspan fill="#4FC1FF">cmd</tspan>/                                <tspan fill="#6A9955"># One binary, named by its folder</tspan></text>
<text x="16" y="276" xml:space="preserve">    main.go</text>
<text x="16" y="295" xml:space="preserve">internal/                              <tspan fill="#6A9955"># Private to this module</tspan></text>
<text x="16" y="314" xml:space="preserve">  $<tspan fill="#4FC1FF">pkg</tspan>/                                <tspan fill="#6A9955"># One package per folder</tspan></text>
<text x="16" y="333" xml:space="preserve">    $<tspan fill="#4FC1FF">file</tspan>.go $<tspan fill="#4FC1FF">code</tspan></text>
<text x="16" y="352" xml:space="preserve">    <tspan fill="#569cd6">?</tspan>{$<tspan fill="#4FC1FF">file</tspan>}_test.go                   <tspan fill="#6A9955"># An optional test beside it</tspan></text>
<text x="16" y="371" xml:space="preserve">pkg/                                   <tspan fill="#6A9955"># Importable by other modules</tspan></text>
<text x="16" y="390" xml:space="preserve">  $<tspan fill="#4FC1FF">pkg</tspan>/                                <tspan fill="#6A9955"># A public package</tspan></text>
<text x="16" y="409" xml:space="preserve">    <tspan fill="#C586C0">{}</tspan>                                 <tspan fill="#6A9955"># Anything goes here</tspan></text>
</g>
</svg>
