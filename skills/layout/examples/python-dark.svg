<svg xmlns="http://www.w3.org/2000/svg" width="672" height="296" viewBox="0 0 672 296" role="img" aria-label="python.layout">
<title>python.layout</title>
<rect width="100%" height="100%" rx="6" fill="#1E1E1E"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#D4D4D4" style="white-space: pre">
<text x="16" y="29" xml:space="preserve"><tspan fill="#6A9955"># A Python package under src/, one module per concern.</tspan></text>
<text x="16" y="67" xml:space="preserve">$<tspan fill="#4EC9B0">mod</tspan>:<tspan fill="#d16969">  [a-z][a-z0-9_]*</tspan></text>
<text x="16" y="86" xml:space="preserve">$<tspan fill="#4EC9B0">code</tspan>: <tspan fill="#d4d4d4">&lt;=</tspan><tspan fill="#b5cea8">800</tspan></text>
<text x="16" y="124" xml:space="preserve">README.md                              <tspan fill="#6A9955"># One: a plain name is exactly one file</tspan></text>
<text x="16" y="143" xml:space="preserve">pyproject.toml</text>
<text x="16" y="162" xml:space="preserve">repo.layout                            <tspan fill="#6A9955"># This contract</tspan></text>
<text x="16" y="181" xml:space="preserve"><tspan fill="#569cd6">?</tspan>uv.lock                               <tspan fill="#6A9955"># ? marks an entry optional</tspan></text>
<text x="16" y="200" xml:space="preserve">src/                                   <tspan fill="#6A9955"># The package, under src/</tspan></text>
<text x="16" y="219" xml:space="preserve">  app/                                 <tspan fill="#6A9955"># The import name</tspan></text>
<text x="16" y="238" xml:space="preserve">    __init__.py</text>
<text x="16" y="257" xml:space="preserve">    $<tspan fill="#4FC1FF">mod</tspan>.py $<tspan fill="#4FC1FF">code</tspan>                      <tspan fill="#6A9955"># Many: one module per concern</tspan></text>
<text x="16" y="276" xml:space="preserve">    <tspan fill="#569cd6">?</tspan>{$<tspan fill="#4FC1FF">mod</tspan>}_test.py                    <tspan fill="#6A9955"># An optional test beside it</tspan></text>
</g>
</svg>
