# The gate, run on GitHub the same way it runs locally. Two steps and no install,
# because layout has no dependencies: run the suites, then check this repo against
# its own contract. That second step is the one that matters — a repo whose shape
# drifts from repo.layout is exactly what this tool exists to catch, and it should
# not be able to happen here quietly.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the active LTS; 23 is what this was developed on. The README claims
        # both, so both are proven here rather than asserted.
        node: [22, 23]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - name: layout checks itself
        run: node src/layout.mjs .
