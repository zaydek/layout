<svg xmlns="http://www.w3.org/2000/svg" width="672" height="543" viewBox="0 0 672 543" role="img" aria-label="examples/features.layout, highlighted in Dark+">
<title>examples/features.layout, highlighted in Dark+</title>
<rect width="100%" height="100%" rx="6" fill="#1E1E1E"/>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#D4D4D4" style="white-space: pre">
<text x="16" y="29" xml:space="preserve"><tspan fill="#6A9955"># Every construct the grammar colors, once each. A full-line comment.</tspan></text>
<text x="16" y="67" xml:space="preserve">$<tspan fill="#4EC9B0">day</tspan>:    <tspan fill="#d16969">/</tspan><tspan fill="#d7ba7d">\d</tspan><tspan fill="#d16969">{4}-</tspan><tspan fill="#d7ba7d">\d</tspan><tspan fill="#d16969">{2}-</tspan><tspan fill="#d7ba7d">\d</tspan><tspan fill="#d16969">{2}/</tspan>           <tspan fill="#6A9955"># A hoist whose value is a regex</tspan></text>
<text x="16" y="86" xml:space="preserve">$<tspan fill="#4EC9B0">post</tspan>:   <tspan fill="#d16969">/{$</tspan><tspan fill="#4FC1FF">day</tspan><tspan fill="#d16969">}-[a-z0-9-]+/</tspan>           <tspan fill="#6A9955"># A regex that names another hoist</tspan></text>
<text x="16" y="105" xml:space="preserve">$<tspan fill="#4EC9B0">media</tspan>:  <tspan fill="#ce9178">png</tspan>,<tspan fill="#ce9178">jpg</tspan>,<tspan fill="#ce9178">webm</tspan>                  <tspan fill="#6A9955"># A hoist whose value is a comma list</tspan></text>
<text x="16" y="124" xml:space="preserve">$<tspan fill="#4EC9B0">code</tspan>:   <tspan fill="#b5cea8">2000</tspan>                          <tspan fill="#6A9955"># A hoist whose value is a number</tspan></text>
<text x="16" y="162" xml:space="preserve">README.md                              <tspan fill="#6A9955"># A literal file, then an inline comment</tspan></text>
<text x="16" y="181" xml:space="preserve"><tspan fill="#569cd6">?</tspan>CHANGELOG.md                          <tspan fill="#6A9955"># ? marks an entry optional</tspan></text>
<text x="16" y="200" xml:space="preserve">CLAUDE.md <tspan fill="#569cd6">-&gt;</tspan> AGENTS.md                 <tspan fill="#6A9955"># A -&gt; B is a symlink</tspan></text>
<text x="16" y="219" xml:space="preserve">AGENTS.md <tspan fill="#569cd6">lines</tspan> <tspan fill="#b5cea8">2000</tspan>                   <tspan fill="#6A9955"># A cap, as a number</tspan></text>
<text x="16" y="238" xml:space="preserve">build.mjs <tspan fill="#569cd6">lines</tspan> {$<tspan fill="#4FC1FF">code</tspan>}                <tspan fill="#6A9955"># A cap, as a hoist</tspan></text>
<text x="16" y="257" xml:space="preserve">posts/                                 <tspan fill="#6A9955"># A literal directory</tspan></text>
<text x="16" y="276" xml:space="preserve">  {$<tspan fill="#4FC1FF">post</tspan>}.md <tspan fill="#569cd6">lines</tspan> {$<tspan fill="#4FC1FF">code</tspan>}             <tspan fill="#6A9955"># {$name}: a hoisted pattern</tspan></text>
<text x="16" y="295" xml:space="preserve">  {:<tspan fill="#9CDCFE">slug</tspan>}/                             <tspan fill="#6A9955"># {:name}: any segment, bound to slug</tspan></text>
<text x="16" y="314" xml:space="preserve">    {:<tspan fill="#9CDCFE">slug</tspan>}.{$<tspan fill="#4FC1FF">media</tspan>}                   <tspan fill="#6A9955"># The binding holds; {$media} is a list</tspan></text>
<text x="16" y="333" xml:space="preserve">  {:<tspan fill="#9CDCFE">kind</tspan>;<tspan fill="#ce9178">draft</tspan>,<tspan fill="#ce9178">live</tspan>}/                  <tspan fill="#6A9955"># {:name;a,b}: an enum, bound</tspan></text>
<text x="16" y="352" xml:space="preserve">    {:<tspan fill="#9CDCFE">n</tspan>;<tspan fill="#d16969">/</tspan><tspan fill="#d7ba7d">\d</tspan><tspan fill="#d16969">+/</tspan>}.md                      <tspan fill="#6A9955"># {:name;/re/}: a regex, bound</tspan></text>
<text x="16" y="371" xml:space="preserve">    {:<tspan fill="#9CDCFE">x</tspan>;$<tspan fill="#4FC1FF">post</tspan>}.txt                     <tspan fill="#6A9955"># {:name;$hoist}: a hoist, bound</tspan></text>
<text x="16" y="390" xml:space="preserve">  {<tspan fill="#ce9178">readme</tspan>,<tspan fill="#ce9178">notes</tspan>}.txt                   <tspan fill="#6A9955"># {a,b,c}: an enum</tspan></text>
<text x="16" y="409" xml:space="preserve">  {<tspan fill="#d16969">/[a-z]+#</tspan><tspan fill="#d7ba7d">\d</tspan><tspan fill="#d16969">/</tspan>}.log                    <tspan fill="#6A9955"># {/re/}: a regex; its # is not a comment</tspan></text>
<text x="16" y="428" xml:space="preserve">  a<tspan fill="#d7ba7d">\{</tspan>b<tspan fill="#d7ba7d">\}\#</tspan>1.md                         <tspan fill="#6A9955"># \{ \} \#: escapes, part of the name</tspan></text>
<text x="16" y="447" xml:space="preserve">  vendor/                              <tspan fill="#6A9955"># A folder that is not ours</tspan></text>
<text x="16" y="466" xml:space="preserve">    <tspan fill="#C586C0">{}</tspan> <tspan fill="#569cd6">lines</tspan> <tspan fill="#569cd6">none</tspan>                      <tspan fill="#6A9955"># {}: the outlet, and lines none</tspan></text>
<text x="16" y="504" xml:space="preserve"><tspan fill="#6A9955"># Frozen by layout freeze; change it only by running it, or by a raise</tspan></text>
<text x="16" y="523" xml:space="preserve"><tspan fill="#569cd6">=</tspan> <tspan fill="#ce9178">posts/2026-10-16-launch.md</tspan> <tspan fill="#569cd6">lines</tspan> <tspan fill="#b5cea8">2306</tspan></text>
</g>
</svg>
